# /www/server/nginx/conf/enable-php-83-wpfastcgi.conf
#
# จุดกลางที่ทุกเว็บ PHP 8.3 ใช้ร่วมกัน - แก้ครั้งเดียวมีผลทุกเว็บ
# ไฟล์เว็บจะมีบรรทัด: include enable-php-83-wpfastcgi.conf;
#
# cache zone "WORDPRESS" ประกาศไว้ที่ /www/server/panel/vhost/nginx/0.fastcgi_cache.conf
#
# WARNING: การอัปเดต aaPanel / WP Toolkit อาจเขียนทับไฟล์นี้
# ตรวจหลังอัปเดตทุกครั้ง: grep -c "fastcgi_cache_lock" <ไฟล์นี้>

set $skip_cache 0;
if ($request_method = POST) {
    set $skip_cache 1;
}
if ($query_string != "") {
    set $skip_cache 1;
}
if ($request_uri ~* "/wp-admin/|/wp-login\.php|/xmlrpc\.php|wp-.*\.php|/feed/|/wp-json/|sitemap(_index)?\.xml") {
    set $skip_cache 1;
}
if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in|woocommerce_items_in_cart|woocommerce_cart_hash") {
    set $skip_cache 1;
}

location ~ [^/]\.php(/|$) {
    try_files $uri $uri/ /index.php?$args;
    fastcgi_pass unix:/tmp/php-cgi-83.sock;
    fastcgi_index index.php;
    include fastcgi.conf;

    fastcgi_cache WORDPRESS;
    fastcgi_cache_valid 200 301 302 1h;
    fastcgi_cache_bypass $skip_cache;
    fastcgi_no_cache $skip_cache;

    # 100 คนเข้าพร้อมกันตอน cache หมดอายุ -> PHP ทำงานแค่ครั้งเดียว
    fastcgi_cache_lock on;
    # อัปเดต cache เบื้องหลัง ผู้ใช้ไม่ต้องรอ
    fastcgi_cache_background_update on;
    # ถ้า PHP ล่ม ยังเสิร์ฟ cache เก่าได้ -> เว็บไม่ขึ้น 502
    fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;

    add_header X-Cache "$upstream_cache_status From $host";
    add_header Nginx-Cache "$upstream_cache_status";
    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload";
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    etag on;
}

location ~ /purge(/.*) {
    allow 127.0.0.1;
    deny all;
    fastcgi_cache_purge WORDPRESS "$scheme$request_method$host$1";
}
