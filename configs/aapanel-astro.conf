# กฎ nginx สำหรับ "เว็บ static" บน aaPanel (เช่น เว็บที่ build ด้วย Astro)
#
# วางไว้ที่ /www/server/panel/vhost/nginx/extension/<domain>/astro.conf
# ซึ่ง vhost ของ panel include ให้เองอยู่แล้ว — ไม่ต้องแก้ไฟล์ของ panel
#
# ตอน Add site ในแผงให้เลือก PHP version = Static (vhost จะได้ enable-php-00)
# ไซต์แบบนี้ไม่ต้องมี database ไม่ต้องผ่าน WP Toolkit และไม่ใช้ FastCGI cache
#
# ไฟล์เว็บ deploy ลงที่ /www/wwwroot/<domain> ตรง ๆ (ไม่ต้องตั้ง Running directory)

# Astro สร้างหน้าเป็นโฟลเดอร์ (promotion/index.html) ไม่ใช่ไฟล์ .html เดี่ยว ๆ
# /promotion จึงต้องวิ่งผ่าน $uri/ ก่อนค่อยตกมาที่ .html
# route ภาษาไทยอย่าง /ทางเข้า/ มาถึงในรูป percent-encoded และแมตช์ชื่อโฟลเดอร์ UTF-8 ได้เลย
location / {
    try_files $uri $uri/ $uri.html =404;
}

# ชื่อไฟล์ใน /_astro/ มี content hash อยู่แล้ว ส่วน /fonts/ ไม่เคยเปลี่ยน จึงแช่ได้ 1 ปี
#
# ^~ สำคัญมาก: มันหยุดไม่ให้ nginx ไปไล่ regex location ของ panel ต่อ ซึ่งตัวหนึ่ง
# (`location ~ .*\.(js|css)?$ { expires 12h; }`) จะกด .js/.css ในนี้เหลือ 12 ชั่วโมง
#
# การประกาศ add_header ใน location จะทิ้ง add_header ที่สืบทอดมาจาก server block
# จึงต้องเขียน HSTS ซ้ำ ไม่งั้นหายเฉพาะไฟล์ในสองโฟลเดอร์นี้
location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000";
    access_log off;
}

location ^~ /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000";
    access_log off;
}

# build ของเว็บ static ไม่มีไฟล์ PHP สักตัว อะไรที่ขอมาคือบอทสแกน
location ~ \.php$ {
    return 404;
}
