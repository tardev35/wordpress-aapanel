# /www/server/panel/vhost/nginx/0.catchall_ssl.conf
#
# ปิดรู default_server ของพอร์ต 443
#
# ปัญหา: 0.default.conf ที่ aaPanel สร้างให้มีแค่ `listen 80` และทั้งเครื่องไม่มีใคร
# ประกาศ `default_server` เลย nginx จึงเลือก server block แรกที่ listen 443 ตามลำดับ
# การโหลด (= ชื่อไฟล์เรียงตัวอักษร) มาเป็น default ผลคือโดเมนที่ชี้มาที่เครื่องนี้แต่ยังไม่มี
# vhost จะได้เว็บของลูกค้าอีกรายไปเต็ม ๆ พร้อม cert ของเว็บนั้น
#
# ชื่อไฟล์ต้องขึ้นต้นด้วย 0. เพื่อให้โหลดก่อน vhost ของไซต์ทุกตัว
#
# ไฟล์นี้แตะเฉพาะพอร์ต 443 — พอร์ต 80 ปล่อยให้ 0.default.conf ของ panel ดูแลต่อ
# ทั้งเพื่อไม่ให้หน้า "Website not found" หายไป และเพื่อให้ Let's Encrypt แบบ HTTP-01
# (ซึ่งวิ่งผ่านพอร์ต 80) ต่ออายุได้เหมือนเดิมทุกไซต์
#
# cert เป็น self-signed ของตัวเอง ไม่ยืมของไซต์ไหน — ถ้ายืมแล้ววันหนึ่งไซต์นั้นถูกลบ
# nginx จะสตาร์ทไม่ขึ้นทั้งเครื่อง สร้างด้วย:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#     -keyout /www/server/nginx/conf/catchall.key \
#     -out    /www/server/nginx/conf/catchall.crt \
#     -subj "/CN=unmatched-host"
#
# ติดตั้งอัตโนมัติด้วย scripts/harden-nginx.sh

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /www/server/nginx/conf/catchall.crt;
    ssl_certificate_key /www/server/nginx/conf/catchall.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # www ของไซต์ที่ไม่มี www ใน server_name ก็ตกมาที่นี่ ส่งกลับไป apex ให้เลย
    # แทนที่จะ 404 ทิ้ง
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    return 404;
}
