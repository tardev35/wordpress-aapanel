; /www/server/php/83/etc/php-fpm.conf
;
; pm = ondemand คือหัวใจของแผน 100 เว็บ:
; worker เกิดเมื่อมี request และตายเมื่อว่าง 30 วินาที
; -> เว็บที่ไม่มีคนเข้ากิน RAM = 0
;
; งบ RAM: 35 children x ~80 MB = 2.8 GB
; กฎ: ผลรวม max_children ของทุกเวอร์ชัน PHP ต้องไม่เกิน 40
;
; ตรวจก่อน start เสมอ:
;   /www/server/php/83/sbin/php-fpm -t -y /www/server/php/83/etc/php-fpm.conf

[global]
pid = /www/server/php/83/var/run/php-fpm.pid
error_log = /www/server/php/83/var/log/php-fpm.log
log_level = notice

[www]
listen = /tmp/php-cgi-83.sock
listen.backlog = 8192
listen.allowed_clients = 127.0.0.1
listen.owner = www
listen.group = www
listen.mode = 0600
user = www
group = www

pm = ondemand
pm.status_path = /phpfpm_83_status
pm.max_children = 35
pm.process_idle_timeout = 30s
pm.max_requests = 1000

request_terminate_timeout = 300
request_slowlog_timeout = 5
slowlog = /www/server/php/83/var/log/slow.log
