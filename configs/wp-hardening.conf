# /www/server/nginx/conf/wp-hardening.conf
#
# กฎ nginx ที่ปิดทางเข้าที่ WordPress โดนบ่อยที่สุด
# symlink เข้าทุกไซต์ผ่าน extension/<domain>/01-hardening.conf เหมือน common-site.conf
#
# 🔴 เขียนขึ้นหลังเหตุการณ์จริง 2026-08-29 บน bbc29pro.com
#
#   - xmlrpc.php โดนยิง 15,217 POST ใน 1 ชั่วโมงบนเครื่องเดียว ทุก POST ข้าม FastCGI
#     cache แล้วรัน WordPress เต็มรูป -> CPU 92% load 3.5 บนเครื่อง 4 cores
#   - ผู้บุกรุกวางเว็บเชลล์ไว้ที่ wp-includes/x9d5285/, wp-includes/system/,
#     wp-content/uploads/.well-known/.<md5>system/ และโปรย .htaccess ของตัวเอง 199 ไฟล์
#     (nginx ไม่อ่าน .htaccess อยู่แล้ว - เขาวางไว้กัน "เพื่อนร่วมอาชีพ" ไม่ให้แย่งเชลล์)
#
# กฎพวกนี้ไม่ได้แทนการอัปเดตปลั๊กอิน มันแค่ทำให้ช่องที่เจาะได้เอาไปใช้ต่อไม่ได้

# ---------- 1. xmlrpc.php ----------
# 🔴 กฎนี้อยู่ใน common-site.conf ไม่ใช่ที่นี่ - ใส่ไปตอนฉุกเฉิน 2026-08-29
# ถ้าเขียนซ้ำที่นี่ nginx จะฟ้อง "duplicate location" แล้ว **ทั้งเครื่อง reload ไม่ได้**
# (เจอจริงตอนติดตั้งครั้งแรก) ถ้าจะย้ายมารวมที่นี่ ต้องเอาออกจาก common-site.conf ก่อน

# ---------- 2. ห้ามรัน PHP ในโฟลเดอร์ที่ผู้ใช้อัปไฟล์ได้ ----------
# ช่องโหว่ upload ส่วนใหญ่จบลงที่การวางไฟล์ .php ไว้ในนี้ ถ้ารันไม่ได้ ก็เอาไปใช้ต่อไม่ได้
# ไม่มีเหตุผลที่ WordPress จะต้องรัน PHP จาก uploads เลย
location ~* ^/wp-content/uploads/.*\.(php|phtml|php[0-9]|phps|pht|shtml|cgi|pl|py)$ {
    deny all;
    access_log off;
    return 403;
}

# ---------- 3. ห้ามเรียก PHP ใน wp-includes ตรง ๆ ----------
# WordPress โหลดไฟล์พวกนี้ผ่าน PHP ด้วยกันเอง ไม่ต้องให้เบราว์เซอร์เรียกตรง
# ยกเว้น 2 ไฟล์ที่ต้องเรียกจากภายนอกจริง
# เคสจริง: เชลล์ถูกวางที่ wp-includes/x9d5285/index.php แล้วเรียกผ่าน URL ตรง ๆ
location ~* ^/wp-includes/.*\.php$ {
    deny all;
    access_log off;
    return 403;
}
location = /wp-includes/js/tinymce/wp-tinymce.php { allow all; }
location = /wp-includes/ms-files.php              { allow all; }

# ---------- 4. โฟลเดอร์และไฟล์ซ่อน ----------
# ผู้บุกรุกชอบซ่อนของใน .well-known/.<hash>/ เพราะดูเหมือนของจริง
# ต้องยกเว้น acme-challenge ไม่งั้น Let's Encrypt ต่ออายุไม่ผ่าน (ดู docs/07 ข้อ 14)
location ~ /\.well-known/acme-challenge/ { allow all; }
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    return 404;
}

# ---------- 5. ไฟล์ที่ไม่ควรหลุดออกไป ----------
location ~* ^/(wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt|xmlrpc\.php)$ {
    deny all;
    access_log off;
    return 403;
}
location ~* \.(sql|bak|old|orig|save|swp|log|env|ini|sh|zip|tar|gz)$ {
    deny all;
    access_log off;
    return 403;
}

# ---------- 6. ปิดการดึงรายชื่อผู้ใช้ ----------
# WordPress เปิด REST API ให้ใครก็ได้ดึงรายชื่อผู้ใช้ โดยไม่ต้องล็อกอิน
# ทดสอบจริงบน neda88-pro.com ได้ชื่อ "admin" กลับมาเลย
#
# ทำไมสำคัญ: การเดารหัสผ่านต้องมี 2 อย่างคือ ชื่อผู้ใช้ กับ รหัสผ่าน
# ถ้าชื่อผู้ใช้แจกฟรี งานของบอทเหลือครึ่งเดียว และ "admin" คือชื่อที่มันเดาก่อนอยู่แล้ว
#
# ปิดเฉพาะ endpoint users - REST API ตัวอื่นยังใช้ได้ปกติ (ธีมและปลั๊กอินหลายตัวต้องใช้)
location ~* ^/wp-json/wp/v[0-9]+/users {
    deny all;
    access_log off;
    return 401;
}
# ทางเก่าที่ให้ผลเดียวกัน - /?author=1 จะ redirect ไป /author/<ชื่อจริง>/
location ~* ^/(index\.php)?/?\?author= {
    deny all;
    access_log off;
    return 403;
}

# ---------- 7. จำกัดอัตราการยิง wp-login.php ----------
# zone ประกาศไว้ที่ 0.fastcgi_cache.conf (ระดับ http) - ที่นี่แค่เอามาใช้
# 5 req/นาที ต่อ IP เผื่อ burst 3 ครั้ง คนพิมพ์รหัสผิดไม่กระทบ บอทยิงรัวโดนหมด
location = /wp-login.php {
    limit_req zone=wplogin burst=3 nodelay;
    try_files $uri =404;
    fastcgi_pass unix:/tmp/php-cgi-83.sock;
    fastcgi_index index.php;
    include fastcgi.conf;
}
