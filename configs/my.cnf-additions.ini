# ค่าที่เพิ่มใน [mysqld] ของ /etc/my.cnf
#
# ก่อนอื่น: aaPanel -> Databases -> Performance tuning -> เลือก Optimization plan "4-8GB"
# (ไม่ใช่ 8-16GB แม้เครื่องจะมี RAM 16 GB - ต้องแบ่งให้ PHP/Redis/OPcache/cache ด้วย)
#
# แล้วแก้ค่าเหล่านี้ใน GUI:
#   innodb_buffer_pool_size = 4096   (MB)
#   query_cache_size        = 0      <- สำคัญที่สุด: global lock ทำให้ 100 DB ช้าลง
#   join_buffer_size        = 256    (KB)
#   read_rnd_buffer_size    = 256    (KB)
#   table_open_cache        = 2048   (GUI บอกห้ามเกิน 2048)
#   max_connections         = 200    (500 x per-connection buffers = เกิน RAM)
#
# ค่าด้านล่างนี้ GUI ไม่มี ต้องแก้ไฟล์เอง

[mysqld]
innodb_buffer_pool_instances = 4
innodb_file_per_table = ON
innodb_flush_method = O_DIRECT

# แลกความปลอดภัย 1 วินาทีสุดท้ายกับความเร็ว
# WooCommerce ที่รับคำสั่งซื้อจริง -> เปลี่ยนกลับเป็น 1
innodb_flush_log_at_trx_commit = 2

# NVMe รับ I/O ได้สูงกว่าค่าเริ่มต้น (200) มาก
innodb_io_capacity = 2000
innodb_io_capacity_max = 4000

table_definition_cache = 2000
open_files_limit = 20000

wait_timeout = 300
interactive_timeout = 300

slow_query_log = 1
long_query_time = 2
