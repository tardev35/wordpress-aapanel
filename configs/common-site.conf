# /www/server/nginx/conf/common-site.conf
#
# กฎกลางที่ทุกไซต์ใช้ร่วมกัน — ไม่มีชื่อโดเมนอยู่ข้างในเลย จึงใช้ไฟล์เดียวกับทุกเว็บได้
#
# ติดตั้งด้วยการ symlink เข้า extension dir ของแต่ละไซต์:
#   /www/server/panel/vhost/nginx/extension/<domain>/00-common.conf
#
# vhost ที่ aaPanel สร้างมีบรรทัดนี้อยู่แล้วตั้งแต่ต้น server block:
#   include /www/server/panel/vhost/nginx/extension/<domain>/*.conf;
# จึงเป็นที่วางกฎเองที่ปลอดภัยที่สุด — panel เขียน vhost ใหม่ (ต่ออายุ SSL, เปลี่ยน
# setting, อัปเดต panel) กี่ครั้งก็ไม่ทับไฟล์ในนี้
#
# ใช้ scripts/stamp-site.sh <domain> ทำ symlink + reload ให้ในคำสั่งเดียว

# www -> non-www ที่ระดับ nginx
#
# ทำไมต้องมี ทั้งที่ WordPress redirect ให้อยู่แล้ว: ตัว WP ทำได้ก็ต่อเมื่อ WP ถูกติดตั้ง
# และทำงานอยู่ (สังเกต header `x-redirect-by: WordPress`) ไซต์ที่เพิ่งสร้างยังไม่ได้ลง WP
# จึงไม่มี redirect เลย และถ้ามีคนไปแก้ siteurl/home ในหลังบ้าน redirect ก็หายทันที
# ทำที่ nginx แปลว่าจบตั้งแต่ก่อนถึง PHP และใช้ได้กับไซต์ static ด้วย
if ($host ~* ^www\.(.+)$) {
    return 301 https://$1$request_uri;
}
