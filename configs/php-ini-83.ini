; ค่าที่เพิ่ม/แก้ใน /www/server/php/83/etc/php.ini
; แก้ผ่าน aaPanel -> App Store -> PHP-8.3 -> Config -> php.ini
; ถ้ามีค่าเดิมอยู่แล้ว ให้แก้ค่าเดิม ไม่ใช่เพิ่มบรรทัดใหม่

; --- OPcache ---
; หมายเหตุ: 1 GB ไม่พอเก็บครบ 100 เว็บ แต่ไม่เป็นปัญหา
; เพราะเก็บเฉพาะเว็บที่มีคนเข้าจริงโดยอัตโนมัติ
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 1024
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 200000
opcache.revalidate_freq = 60
opcache.validate_timestamps = 1
opcache.save_comments = 1

; ไม่เปิด JIT - WordPress เป็นงาน I/O-bound ไม่ใช่ CPU-bound
; opcache.jit = off

; --- ทั่วไป ---
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 64M
post_max_size = 64M
max_input_vars = 3000
realpath_cache_size = 4096k
realpath_cache_ttl = 600
expose_php = Off

; --- ความปลอดภัย ---
; สำคัญเพราะทุกเว็บรัน user www เดียวกัน
; อย่าใส่ putenv/getenv - ปลั๊กอิน WordPress บางตัวใช้และจะพังทันที
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source
